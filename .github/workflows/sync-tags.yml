name: Sync tags from upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/simoncaron/ansible-role-pve_acme.git

      - name: Fetch tags and commits from upstream
        run: |
          git fetch upstream --tags --force

      - name: Push tags and associated commits to fork
        run: |
          git push origin --tags --force
          # Optionnel : pousser aussi la branche main/master si tu veux synchroniser le code
          # git push origin main --force
